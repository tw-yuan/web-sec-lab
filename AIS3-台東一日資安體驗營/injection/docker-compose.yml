services:
  web:
    build: .
    ports:
      - "10003:5000"
    environment:
      - FLAG_CMDI=AIS3{c0mm4nd_1nj3ct10n_g1v3s_y0u_sh3ll}
      - FLAG_XSS=AIS3{xss_st34ls_c00k13s_l1k3_c4ndy}
      - FLAG_SSTI=AIS3{sst1_t3mpl4t3_1nj3ct10n_pwn3d}
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
